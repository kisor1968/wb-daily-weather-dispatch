name: Daily Weather Dispatch

on:
  schedule:
    # Runs everyday at 01:30 UTC (7:00 AM IST)
    - cron: '30 1 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub anytime

jobs:
  run-weather-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pillow schedule

      - name: Run weather dispatcher script
        run: |
          python Daily_Morning_Weather_Dispatch.py
